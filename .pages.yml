# Pages CMS configuration: https://pagescms.org/docs/
# Sign in at https://app.pagescms.org with GitHub, open VyuhaAero/website and edit.
# Every save is a commit to this repository, and the site redeploys automatically.

media:
  input: public/media
  output: /media

content:
  - name: updates
    label: Updates (news)
    type: collection
    path: content/updates
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, category, draft]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        options:
          values: [Company, Engineering, Programme, Recognition, Event, Hiring]
      - name: summary
        label: Summary (shown on cards)
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: draft
        label: Draft (hide from the website)
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text

  - name: site
    label: Site, hero, film, careers and contact
    type: file
    path: content/site.json
    format: json
    fields:
      - name: company
        label: Company name
        type: string
      - name: tagline
        label: Tagline (browser tab)
        type: string
      - name: seo_description
        label: Search engine description
        type: text
      - name: hero
        label: Hero (top of the home page)
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: headline_accent, label: Headline second line (amber), type: string }
          - { name: intro, label: Introduction, type: text }
          - { name: primary_label, label: Film button text, type: string }
          - { name: secondary_label, label: Second button text, type: string }
          - { name: status, label: Status shown in the strip under the hero, type: string }
      - name: statement
        label: Statement (large centred lines)
        type: object
        fields:
          - { name: lines, label: Lines, type: string, list: true }
          - { name: body, label: Paragraph, type: text }
      - name: mission
        label: Who we are
        type: object
        fields:
          - { name: label, label: Section label, type: string }
          - { name: title, label: Title, type: string }
          - { name: title_accent, label: Title second line, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - name: facts
            label: Facts row
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }
      - name: film
        label: Launch film
        type: object
        fields:
          - { name: label, label: Section label, type: string }
          - { name: title, label: Title, type: string }
          - { name: caption, label: Caption, type: text }
          - { name: video, label: Video file (MP4), type: file }
          - { name: poster, label: Poster image, type: image }
          - { name: youtube, label: YouTube link (optional; used instead of the video file when set), type: string }
      - name: careers
        label: Join us
        type: object
        fields:
          - { name: label, label: Section label, type: string }
          - { name: title, label: Title, type: string }
          - { name: title_accent, label: Title second line, type: string }
          - { name: body, label: Paragraph, type: text }
          - { name: areas, label: Areas, type: string, list: true }
          - { name: email, label: Email for applications, type: string }
      - name: contact
        label: Contact and social links
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: address_lines, label: Address lines, type: string, list: true }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: instagram, label: Instagram URL, type: string }
          - { name: x, label: X (Twitter) URL, type: string }
          - { name: youtube, label: YouTube URL, type: string }

  - name: capabilities
    label: What we build
    type: file
    path: content/capabilities.json
    format: json
    fields:
      - { name: label, label: Section label, type: string }
      - { name: title, label: Title, type: string }
      - { name: title_accent, label: Title second line, type: string }
      - { name: intro, label: Introduction, type: text }
      - name: areas
        label: Capability areas
        type: object
        list: true
        fields:
          - { name: code, label: Number, type: string }
          - { name: title, label: Title, type: string }
          - { name: body, label: Description, type: text }
      - name: programmes
        label: Programmes (keep to one line each, no specifications)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: kind, label: Type, type: string }
          - { name: body, label: One-line description, type: text }
          - { name: status, label: Status, type: string }

  - name: principles
    label: How we work
    type: file
    path: content/principles.json
    format: json
    fields:
      - { name: label, label: Section label, type: string }
      - { name: title, label: Title, type: string }
      - { name: title_accent, label: Title second line, type: string }
      - name: items
        label: Principles
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: body, label: Description, type: text }

  - name: roadmap
    label: Roadmap
    type: file
    path: content/roadmap.json
    format: json
    fields:
      - { name: label, label: Section label, type: string }
      - { name: title, label: Title, type: string }
      - { name: title_accent, label: Title second line, type: string }
      - { name: note, label: Note, type: text }
      - name: phases
        label: Phases
        type: object
        list: true
        fields:
          - { name: phase, label: Number, type: string }
          - { name: title, label: Title, type: string }
          - { name: body, label: Description, type: text }
          - { name: current, label: Current phase, type: boolean }

  - name: team
    label: People
    type: file
    path: content/team.json
    format: json
    fields:
      - { name: label, label: Section label, type: string }
      - { name: title, label: Title, type: string }
      - { name: title_accent, label: Title second line, type: string }
      - name: members
        label: Team members
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }
          - { name: photo, label: Photo (square works best), type: image }
          - { name: linkedin, label: LinkedIn URL (optional), type: string }
